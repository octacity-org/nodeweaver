[project]
name = "nodeweaver"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Emre Aydın", email = "emre.aydings11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "typer>=0.27.3",
]

[project.scripts]
nodeweaver = "nodeweaver.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
